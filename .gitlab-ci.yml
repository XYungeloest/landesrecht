# GitLab-CI des Landesrechtsportals.
#
# Prüfstufen laufen bei jedem Push und Merge Request; Deployment-Jobs laufen nur auf dem
# Produktionsbranch, erst nach erfolgreichen Prüfungen und ausschließlich manuell. Ohne die
# CI/CD-Variablen CLOUDFLARE_ACCOUNT_ID und CLOUDFLARE_API_TOKEN (Projekt-Settings → CI/CD →
# Variables, maskiert und geschützt) bricht ein Deploy-Job kontrolliert ab, bevor Wrangler läuft.
# Es werden keine Secrets in diesem Repository gespeichert (docs/DEPLOYMENT.md).

stages:
  - install
  - check
  - test
  - build
  - deploy

variables:
  NODE_OPTIONS: '--max-old-space-size=4096'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  PRODUCTION_BRANCH: main

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - node --version
    - npm --version

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

install:
  stage: install
  script:
    - npm ci --no-audit --no-fund
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
      - packages/importers/*/node_modules/

check:
  stage: check
  needs: [install]
  script:
    - npm run check
    - npm run content:check
    - npm run d1:schema:check

test:
  stage: test
  needs: [install]
  script:
    - npm run test
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: test-results/junit.xml
    paths:
      - test-results/

build:
  stage: build
  needs: [install, check]
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - apps/web/dist/

# Vorbereitete Deployment-Stufe: nur auf dem Produktionsbranch, nur manuell, nur mit Zugangsdaten.
# Die D1-Projektion wird nie automatisch gegen die produktive Datenbank ausgeführt; sie bleibt ein
# geprüfter manueller Schritt (npm run d1:apply:remote → wrangler d1 execute, docs/DEPLOYMENT.md).
.cloudflare_guard: &cloudflare_guard
  - |
    if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
      echo "CLOUDFLARE_ACCOUNT_ID und CLOUDFLARE_API_TOKEN sind nicht gesetzt – Deployment wird nicht ausgeführt."
      exit 1
    fi

deploy:staging:
  stage: deploy
  needs: [build]
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH
      when: manual
      allow_failure: true
  script:
    - *cloudflare_guard
    - npx wrangler deploy --config apps/web/dist/server/wrangler.json --env staging

deploy:production:
  stage: deploy
  needs: [build, deploy:staging]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH
      when: manual
      allow_failure: false
  script:
    - *cloudflare_guard
    - npm run deploy --workspace @landesrecht/web
